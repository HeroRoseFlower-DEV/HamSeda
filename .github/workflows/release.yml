name: Release HamSeda

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

concurrency:
  group: hamseda-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-gate:
    name: Require green CI on the tagged commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify Android CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          echo "Checking CI status for tagged commit $SHA"
          # The tag points at a main-branch commit; android.yml runs on main
          # pushes, so the commit must have a successful workflow run.
          RUN_ID="$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SHA&status=success" \
            --jq '.workflow_runs[] | select(.name == "Android CI" or .path == ".github/workflows/android.yml") | .id' \
            | head -n 1)"
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful Android CI run found for commit $SHA. Push the tag only after CI is green on main."
            gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SHA" \
              --jq '.workflow_runs[] | "\(.name): \(.status)/\(.conclusion)"'
            exit 1
          fi
          echo "CI gate passed (run $RUN_ID)."

  release:
    needs: ci-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            CT="$ANDROID_HOME/cmdline-tools/latest"
          else
            CT="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/ | sort -V | tail -n1)"
          fi
          export PATH="$CT/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0" \
            "ndk;30.0.16248370" "cmake;3.31.6" \
            || sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" \
              "ndk;30.0.16248370" "cmake;3.31.6"

      - name: Validate signing secrets
        shell: bash
        env:
          HAMSEDA_KEYSTORE_BASE64: ${{ secrets.HAMSEDA_KEYSTORE_BASE64 }}
          HAMSEDA_KEYSTORE_PASSWORD: ${{ secrets.HAMSEDA_KEYSTORE_PASSWORD }}
          HAMSEDA_KEY_ALIAS: ${{ secrets.HAMSEDA_KEY_ALIAS }}
          HAMSEDA_KEY_PASSWORD: ${{ secrets.HAMSEDA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in HAMSEDA_KEYSTORE_BASE64 HAMSEDA_KEYSTORE_PASSWORD HAMSEDA_KEY_ALIAS HAMSEDA_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required repository secret $name is not configured."
              exit 1
            fi
          done

      - name: Validate tag and version metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(./gradlew -q printReleaseMetadata --no-daemon)"
          IFS='|' read -r app_version app_code <<< "$metadata"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ ! "$app_version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Unexpected app versionName: $app_version"
            exit 1
          fi
          if [[ ! "$app_code" =~ ^[0-9]+$ ]] || [ "$app_code" -lt 1 ]; then
            echo "::error::versionCode must be a positive integer; got: $app_code"
            exit 1
          fi
          if [ "$tag_version" != "$app_version" ] && [ "$tag_version" != "${app_version}.0" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app versionName $app_version."
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != "tag" ]; then
            echo "::error::Release tags must be annotated Git tags."
            exit 1
          fi
          mapfile -t version_tags < <(git tag --list "v*" --sort=-version:refname)
          if [ "${version_tags[0]:-}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::This tag is not the newest version tag; refusing an out-of-order release."
            exit 1
          fi
          if [ "${#version_tags[@]}" -gt 1 ]; then
            previous_tag="${version_tags[1]}"
            previous_version_code="$(git show "$previous_tag:app/build.gradle.kts" | sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p' | head -n1)"
            if [[ ! "$previous_version_code" =~ ^[0-9]+$ ]]; then
              echo "::error::Could not read a numeric versionCode from previous tag $previous_tag."
              exit 1
            fi
            if [ "$app_code" -le "$previous_version_code" ]; then
              echo "::error::versionCode $app_code must exceed previous release $previous_tag versionCode $previous_version_code."
              exit 1
            fi
          fi
          echo "Validated release tag $GITHUB_REF_NAME (versionName=$app_version, versionCode=$app_code)."
          echo "version_name=$app_version" >> "$GITHUB_OUTPUT"
          echo "version_code=$app_code" >> "$GITHUB_OUTPUT"

      - name: Prepare temporary signing key
        shell: bash
        env:
          HAMSEDA_KEYSTORE_BASE64: ${{ secrets.HAMSEDA_KEYSTORE_BASE64 }}
          HAMSEDA_KEYSTORE_PASSWORD: ${{ secrets.HAMSEDA_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/hamseda-release.jks"
          printf '%s' "$HAMSEDA_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          test -s "$key_file"
          chmod 600 "$key_file"
          # Fail fast on a corrupt/wrong keystore instead of a cryptic
          # signing failure three steps later. Password comes from the
          # step-level env below; only the alias list is printed.
          keytool -list -keystore "$key_file" \
            -storepass "$HAMSEDA_KEYSTORE_PASSWORD" > /dev/null
          echo "HAMSEDA_KEYSTORE_PATH=$key_file" >> "$GITHUB_ENV"

      - name: Build signed release APK and Android App Bundle
        shell: bash
        env:
          HAMSEDA_KEYSTORE_PASSWORD: ${{ secrets.HAMSEDA_KEYSTORE_PASSWORD }}
          HAMSEDA_KEY_ALIAS: ${{ secrets.HAMSEDA_KEY_ALIAS }}
          HAMSEDA_KEY_PASSWORD: ${{ secrets.HAMSEDA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Safety net: the CI gate above checks the main-branch run, but the
          # tag itself never runs CI. Re-run unit tests and lint on the exact
          # tagged source before building the release artifacts.
          ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Verify release signatures and generate checksums
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"

          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          # Certificate pinning: the APK must be signed with the expected
          # release certificate. The SHA-256 fingerprint is stored as the
          # HAMSEDA_CERT_SHA256 secret (hex, no colons). This catches a
          # misconfigured keystore signing with the wrong key.
          EXPECTED_CERT="${{ secrets.HAMSEDA_CERT_SHA256 }}"
          if [ -n "$EXPECTED_CERT" ]; then
            ACTUAL_CERT="$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null \
              | grep -i "SHA-256" | head -n 1 | tr -d ' :' | tr 'a-f' 'A-F' | grep -o '[0-9A-F]\{64\}')"
            EXPECTED_NORM="$(echo "$EXPECTED_CERT" | tr -d ' :' | tr 'a-f' 'A-F')"
            if [ "$ACTUAL_CERT" != "$EXPECTED_NORM" ]; then
              echo "::error::APK certificate fingerprint mismatch; refusing to publish."
              exit 1
            fi
            echo "Certificate pinning passed."
          else
            echo "::warning::HAMSEDA_CERT_SHA256 secret not set; skipping certificate pinning."
          fi
          if ! unzip -Z1 "$AAB" | grep -Eq '^META-INF/[^/]+\.(RSA|DSA|EC)$'; then
            echo "::error::AAB has no JAR signature block; refusing to publish an unsigned bundle."
            exit 1
          fi
          if ! jarsigner -verify -verbose "$AAB" > "$RUNNER_TEMP/aab-jarsigner-verification.txt" 2>&1; then
            cat "$RUNNER_TEMP/aab-jarsigner-verification.txt"
            exit 1
          fi
          if ! grep -Fq "jar verified." "$RUNNER_TEMP/aab-jarsigner-verification.txt"; then
            cat "$RUNNER_TEMP/aab-jarsigner-verification.txt"
            echo "::error::jarsigner did not confirm the AAB signature."
            exit 1
          fi

          # ABI check: the release APK must ship native libraries for every
          # ABI in the abiFilters list (arm64-v8a, armeabi-v7a, x86_64, x86).
          # A missing ABI means the NDK build silently dropped an architecture.
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            if ! unzip -Z1 "$APK" | grep -Fq "lib/$abi/"; then
              echo "::error::Release APK is missing native libraries for ABI: $abi"
              exit 1
            fi
          done
          echo "ABI check passed: all 4 native library directories present."

          mkdir -p release-assets
          # Deterministic names: the publish step below references them
          # explicitly instead of a glob, so a stray file can never be
          # uploaded by accident.
          cp "$APK" "release-assets/HamSeda-$GITHUB_REF_NAME.apk"
          cp "$AAB" "release-assets/HamSeda-$GITHUB_REF_NAME.aab"
          (
            cd release-assets
            sha256sum "HamSeda-$GITHUB_REF_NAME.apk" "HamSeda-$GITHUB_REF_NAME.aab" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          echo "Release artifacts verified; SHA-256 manifest generated."

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/HamSeda-$GITHUB_REF_NAME.apk" \
            "release-assets/HamSeda-$GITHUB_REF_NAME.aab" \
            release-assets/SHA256SUMS \
            --verify-tag \
            --title "HamSeda $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE_NOTES_TEMPLATE.md

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${HAMSEDA_KEYSTORE_PATH:-}" ]; then
            rm -f "$HAMSEDA_KEYSTORE_PATH"
          else
            rm -f "$RUNNER_TEMP/hamseda-release.jks"
          fi
