name: Build HamSeda APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Least privilege: the debug build only reads the repository.
permissions:
  contents: read

# L13: cancel superseded runs on the same branch so concurrent pushes don't
# race artifact uploads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # M2: third-party actions are pinned to full commit SHAs (version
      # comments for readability). A compromised mutable tag cannot inject
      # code into the APK build.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The ubuntu-24.04 runner image ships an Android SDK; install the
      # exact platform + build-tools the project targets (API 37).
      - name: Set up Android SDK packages
        run: |
          set -e
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            CT="$ANDROID_HOME/cmdline-tools/latest"
          else
            CT="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/ | sort -V | tail -n1)"
          fi
          echo "Using cmdline-tools: $CT"
          export PATH="$CT/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          # API 37 platform: try the canonical path, fall back to the .0 variant.
          sdkmanager "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;3.31.6" \
            || sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;3.31.6"

      - name: Verify Gradle wrapper
        # The checked-in wrapper JAR is pinned to Gradle's published official 9.8.1 checksum.
        # The wrapper distribution itself is SHA-256 pinned to 9.8.1 in gradle-wrapper.properties.
        run: |
          set -e
          echo "3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict
          ./gradlew --version

      - name: Verify source-backed documentation contracts
        run: bash .github/scripts/verify-consistency.sh

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Compile instrumented tests
        # Compiles androidTest sources; execution needs an emulator/device
        # (see docs/TEST_PLAN.md). Compilation is verified here.
        run: ./gradlew :app:assembleAndroidTest --no-daemon --stacktrace

      - name: Start Android Emulator (API 35, x86_64)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --name hamseda-api35 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device pixel_2 --force
          "$ANDROID_HOME/emulator/emulator" \
            -avd hamseda-api35 -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -accel on -wipe-data \
            > "$RUNNER_TEMP/hamseda-emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/hamseda-emulator.pid"
          adb start-server
          adb wait-for-device
          booted=""
          for attempt in $(seq 1 180); do
            if ! kill -0 "$(cat "$RUNNER_TEMP/hamseda-emulator.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/hamseda-emulator.log"
              echo "::error::Android Emulator exited before boot completed"
              exit 1
            fi
            booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$booted" = "1" ]; then break; fi
            sleep 5
          done
          if [ "$booted" != "1" ]; then
            cat "$RUNNER_TEMP/hamseda-emulator.log"
            echo "::error::Android Emulator did not finish booting within 15 minutes"
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          # Pre-grant only runtime permissions needed to let the app reach its
          # normal UI in instrumentation tests. This is test setup, not an app
          # permission-policy change; no radio hardware behavior is simulated.
          adb shell pm grant com.hamseda.walkie android.permission.RECORD_AUDIO
          adb shell pm grant com.hamseda.walkie android.permission.NEARBY_WIFI_DEVICES
          adb shell pm grant com.hamseda.walkie android.permission.BLUETOOTH_SCAN
          adb shell pm grant com.hamseda.walkie android.permission.BLUETOOTH_CONNECT
          adb install app/build/outputs/apk/debug/app-debug.apk
          adb devices -l

      - name: Execute instrumented tests on Android Emulator
        timeout-minutes: 20
        run: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Capture emulator diagnostics
        if: always()
        run: |
          set +e
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb logcat -d -t 12000 > "$RUNNER_TEMP/hamseda-emulator-logcat.txt"
          adb shell getprop > "$RUNNER_TEMP/hamseda-emulator-getprop.txt"
          if [ -f "$RUNNER_TEMP/hamseda-emulator.log" ]; then
            cp "$RUNNER_TEMP/hamseda-emulator.log" "$RUNNER_TEMP/hamseda-emulator-console.log"
          fi

      - name: Upload instrumented test reports and emulator logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HamSeda-instrumented-test-results
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
            ${{ runner.temp }}/hamseda-emulator-*.txt
            ${{ runner.temp }}/hamseda-emulator-console.log
          retention-days: 30
          if-no-files-found: warn

      - name: Stop Android Emulator
        if: always()
        run: |
          set +e
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb emu kill
          if [ -f "$RUNNER_TEMP/hamseda-emulator.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/hamseda-emulator.pid")" 2>/dev/null || true
          fi
      - name: Verify APK native ABIs and compute SHA-256
        id: apk
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          echo "APK: $APK"
          test -s "$APK"
          ls -lh "$APK"

          # Verify all four ABIs declared in app/build.gradle.kts contain the JNI codec.
          NATIVE_TMP="$(mktemp -d)"
          trap 'rm -rf "$NATIVE_TMP"' EXIT
          unzip -q "$APK" 'lib/*/libhamseda_opus_jni.so' -d "$NATIVE_TMP"
          LLVM_READELF="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$LLVM_READELF"
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            LIB="$NATIVE_TMP/lib/$ABI/libhamseda_opus_jni.so"
            if [ ! -s "$LIB" ]; then
              echo "::error::Missing native Opus JNI library for ABI $ABI in $APK"
              exit 1
            fi
            # Android 15+ devices can use 16 KiB memory pages. Confirm each
            # packaged ELF has a LOAD segment aligned to 16 KiB, matching the
            # explicit -Wl,-z,max-page-size=16384 link option in CMakeLists.txt.
            if ! "$LLVM_READELF" -lW "$LIB" | awk '$1 == "LOAD" && $NF ~ /^0x0*4000$/ { found=1 } END { exit !found }'; then
              echo "::error::Native library for $ABI has no 16 KiB-aligned LOAD segment"
              "$LLVM_READELF" -lW "$LIB"
              exit 1
            fi
            echo "Verified native Opus JNI: ABI=$ABI, 16KiB ELF LOAD alignment"
          done

          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "SHA-256: $SHA"
          echo "$SHA  $(basename "$APK")" > "$APK.sha256"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HamSeda-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk.sha256
          retention-days: 30
          if-no-files-found: error
