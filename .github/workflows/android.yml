name: Build HamSeda APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Least privilege: the debug build only reads the repository.
permissions:
  contents: read

# L13: cancel superseded runs on the same branch so concurrent pushes don't
# race artifact uploads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # M2: third-party actions are pinned to full commit SHAs (version
      # comments for readability). A compromised mutable tag cannot inject
      # code into the APK build.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The ubuntu-24.04 runner image ships an Android SDK; install the
      # exact platform + build-tools the project targets (API 37).
      - name: Set up Android SDK packages
        run: |
          set -e
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            CT="$ANDROID_HOME/cmdline-tools/latest"
          else
            CT="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/ | sort -V | tail -n1)"
          fi
          echo "Using cmdline-tools: $CT"
          export PATH="$CT/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          # API 37 platform: try the canonical path, fall back to the .0 variant.
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;3.31.6" \
            || sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;3.31.6"

      - name: Verify Gradle wrapper
        # The checked-in wrapper JAR is pinned to Gradle's published official 9.7.0 checksum.
        # The wrapper distribution itself is SHA-256 pinned to 9.7.0 in gradle-wrapper.properties.
        run: |
          set -e
          echo "7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict
          ./gradlew --version

      - name: Check documented versions and crypto domains
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)"
          APP_CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts)"
          WIRE_VERSION="$(sed -nE 's/^[[:space:]]*const val VERSION: Byte = ([0-9]+).*/\1/p' app/src/main/java/com/hamseda/walkie/proto/Protocol.kt)"
          KEY_INFO="$(sed -nE 's/^[[:space:]]*private const val INFO = "([^"]+)".*/\1/p' app/src/main/java/com/hamseda/walkie/crypto/SessionCrypto.kt)"
          SAS_INFO="$(sed -nE 's/^[[:space:]]*private const val SAS_INFO = "([^"]+)".*/\1/p' app/src/main/java/com/hamseda/walkie/crypto/SessionCrypto.kt)"
          test -n "$APP_VERSION" && test -n "$APP_CODE" && test -n "$WIRE_VERSION"
          test -n "$KEY_INFO" && test -n "$SAS_INFO"
          grep -Fq -- "$APP_VERSION" README.md
          grep -Fq -- "$APP_CODE" README.md
          grep -Fq -- "$WIRE_VERSION" README.md
          grep -Fq -- "$KEY_INFO" SECURITY.md
          grep -Fq -- "$SAS_INFO" SECURITY.md
          grep -Fq -- "Gradle 9.7.0" SECURITY.md
          if grep -Eq 'HamSeda-v2/(session-keys|sas)|8\.12\.1|8\.14\.6' SECURITY.md; then
            echo "::error::SECURITY.md contains stale protocol-domain or Gradle version metadata"
            exit 1
          fi
          grep -Fq -- "48 kHz" README.md
          grep -Fq -- "32 kbps" README.md

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Compile instrumented tests
        # Compiles androidTest sources; execution needs an emulator/device
        # (see docs/TEST_PLAN.md). Compilation is verified here.
        run: ./gradlew :app:assembleAndroidTest --no-daemon --stacktrace

      - name: Verify APK native ABIs and compute SHA-256
        id: apk
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          echo "APK: $APK"
          test -s "$APK"
          ls -lh "$APK"

          # Verify all four ABIs declared in app/build.gradle.kts contain the JNI codec.
          NATIVE_TMP="$(mktemp -d)"
          trap 'rm -rf "$NATIVE_TMP"' EXIT
          unzip -q "$APK" 'lib/*/libhamseda_opus_jni.so' -d "$NATIVE_TMP"
          LLVM_READELF="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$LLVM_READELF"
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            LIB="$NATIVE_TMP/lib/$ABI/libhamseda_opus_jni.so"
            if [ ! -s "$LIB" ]; then
              echo "::error::Missing native Opus JNI library for ABI $ABI in $APK"
              exit 1
            fi
            # Android 15+ devices can use 16 KiB memory pages. Confirm each
            # packaged ELF has a LOAD segment aligned to 16 KiB, matching the
            # explicit -Wl,-z,max-page-size=16384 link option in CMakeLists.txt.
            if ! "$LLVM_READELF" -lW "$LIB" | awk '$1 == "LOAD" && $NF ~ /^0x0*4000$/ { found=1 } END { exit !found }'; then
              echo "::error::Native library for $ABI has no 16 KiB-aligned LOAD segment"
              "$LLVM_READELF" -lW "$LIB"
              exit 1
            fi
            echo "Verified native Opus JNI: ABI=$ABI, 16KiB ELF LOAD alignment"
          done

          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "SHA-256: $SHA"
          echo "$SHA  $(basename "$APK")" > "$APK.sha256"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HamSeda-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk.sha256
          retention-days: 30
          if-no-files-found: error
