# Dependabot keeps the Gradle version catalog and GitHub Actions pins fresh.
# Updates arrive as reviewable PRs and never auto-merge: CI (unit tests,
# lint, debug/release builds, instrumented-test compilation) must pass
# before any dependency bump lands on main.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
